  <!-- 5. Inner Code Brackets < > inside Eye (White) -->
  <!-- Left Angle Bracket < -->
  <path d="M10.5 12.6L8.8 14.2L10.5 15.8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Angle Bracket > -->
