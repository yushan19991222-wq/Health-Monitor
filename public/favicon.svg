<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none">
  <style>
    /* Default / Light Mode Browser: Deep Website Obsidian Navy Card with Cyber Cyan Lines */
    .preview-card { fill: #070a0f; stroke: #00f0ff; stroke-width: 0.8; }
    .preview-divider { stroke: #00f0ff; stroke-opacity: 0.9; stroke-width: 1.1; }
    .preview-dot { fill: #00f0ff; }
    .preview-eye { stroke: #00f0ff; stroke-width: 1.2; }
    .preview-bracket { stroke: #00f0ff; stroke-width: 1.2; }

    /* Dark Mode Browser: Glowing Cyber Cyan Card with Deep Obsidian Lines */
    @media (prefers-color-scheme: dark) {
      .preview-card { fill: #00f0ff; stroke: none; }
      .preview-divider { stroke: #070a0f; stroke-opacity: 0.9; stroke-width: 1.1; }
      .preview-dot { fill: #070a0f; }
      .preview-eye { stroke: #070a0f; stroke-width: 1.2; }
      .preview-bracket { stroke: #070a0f; stroke-width: 1.2; }
    }
  </style>

  <!-- 1. Outer Window Card -->
  <rect class="preview-card" x="2" y="2.5" width="20" height="19" rx="3.5"/>

  <!-- 2. Window Header Divider Line -->
  <line class="preview-divider" x1="2" y1="7.2" x2="22" y2="7.2"/>

  <!-- 3. Header Window Dots -->
  <circle class="preview-dot" cx="5" cy="4.8" r="0.75"/>
  <circle class="preview-dot" cx="7.2" cy="4.8" r="0.75" opacity="0.8"/>
  <circle class="preview-dot" cx="9.4" cy="4.8" r="0.75" opacity="0.8"/>

  <!-- 4. Refined Sleek Eye Contour (1.2px) -->
  <path class="preview-eye" d="M5.8 14.2C7.2 12 9.4 10.6 12 10.6C14.6 10.6 16.8 12 18.2 14.2C16.8 16.4 14.6 17.8 12 17.8C9.4 17.8 7.2 16.4 5.8 14.2Z" stroke-linejoin="round" fill="none"/>

  <!-- 5. Inner Code Brackets < > (1.2px) -->
  <path class="preview-bracket" d="M10.4 12.6L8.8 14.2L10.4 15.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="preview-bracket" d="M13.6 12.6L15.2 14.2L13.6 15.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
