<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="previewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer Filled Window Card (Material Symbols Preview Base) -->
  <rect x="2" y="2.5" width="20" height="19" rx="3.5" fill="url(#previewBg)"/>

  <!-- 2. Window Top Bar Divider Line (White) -->
  <line x1="2" y1="7" x2="22" y2="7" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85"/>

  <!-- 3. Top Bar Window Dots (White) -->
  <circle cx="5" cy="4.8" r="0.75" fill="#ffffff"/>
  <circle cx="7.2" cy="4.8" r="0.75" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="9.4" cy="4.8" r="0.75" fill="#ffffff" fill-opacity="0.75"/>

  <!-- 4. Central Surveillance Eye Contour (White) -->
